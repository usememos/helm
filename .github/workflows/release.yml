name: Release

# Pushing a tag equal to the chart version, such as 1.0.0, publishes the chart
# to oci://ghcr.io/usememos/charts/memos and attaches the package to a GitHub release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2

      - name: Check that the tag matches the chart version
        run: |
          version="$(helm show chart charts/memos | awk '$1 == "version:" { print $2 }')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match chart version $version"
            exit 1
          fi

      - name: Package
        run: |
          helm lint --strict charts/memos
          helm package charts/memos --destination dist

      - name: Push to GHCR
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/memos-${GITHUB_REF_NAME}.tgz" oci://ghcr.io/usememos/charts

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tgz
          generate_release_notes: true
