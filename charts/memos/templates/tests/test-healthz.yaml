apiVersion: v1
kind: Pod
metadata:
  name: {{ include "memos.fullname" . }}-test-healthz
  labels:
    {{- include "memos.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: healthz
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      command:
        - wget
        - -q
        - -T
        - "10"
        - -O
        - "-"
        - http://{{ include "memos.fullname" . }}:{{ .Values.service.port }}/healthz
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
